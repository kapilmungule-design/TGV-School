<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Match Game</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="pageHeader">

<a href="braingames.html" class="backBtn">⬅</a>

<h1>🧠 Memory Match</h1>

</header>

<section class="memoryTop">

<div class="memoryBox">

<h3>⏱ Time</h3>

<h2 id="timer">00:00</h2>

</div>

<div class="memoryBox">

<h3>🎯 Moves</h3>

<h2 id="moves">0</h2>

</div>

<div class="memoryBox">

<h3>⭐ Score</h3>

<h2 id="score">0</h2>

</div>

</section>

<section id="memoryGame" class="memoryGrid">

</section>

<div class="restartArea">

<button onclick="startGame()">

🔄 Restart Game

</button>

</div>

<!-- WIN POPUP -->

<div id="winPopup" class="winPopup">

<div class="popupCard">

<h1>
🏆 Congratulations
</h1>

<h3>
Memory Game Completed
</h3>

<div class="stars" id="stars">
⭐⭐⭐
</div>

<p>

Moves :
<span id="finalMoves"></span>

</p>

<p>

Time :
<span id="finalTime"></span>

</p>

<p>

Best Score :
<span id="bestScore"></span>

</p>

<button onclick="playAgain()">

🔄 Play Again

</button>

<button onclick="window.location='braingames.html'">

🏠 Back

</button>

</div>

</div>


<!-- =========================
CONFETTI
========================= -->

<div id="confetti"></div>

<!-- Achievement -->

<div id="achievement" class="achievement">

🏆 Memory Master

</div>


<script src="memory.js"></script>





</body>

</html>
