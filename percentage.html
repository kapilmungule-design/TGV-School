<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Percentage Calculator</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial;

}



body{


min-height:100vh;


background:linear-gradient(
135deg,
#dbeafe,
#dcfce7,
#fef3c7
);


display:flex;

justify-content:center;

align-items:center;


padding:15px;


}





.box{


width:380px;


background:white;


padding:25px;


border-radius:30px;


box-shadow:0 15px 35px #0003;


animation:show .5s;


}



@keyframes show{


from{

opacity:0;

transform:translateY(30px);

}


to{

opacity:1;

}


}



h1{


text-align:center;

color:#047857;

margin-bottom:15px;


}



.icon{


font-size:45px;

text-align:center;


}



input{


width:100%;


padding:13px;


margin-top:12px;


border-radius:12px;


border:1px solid #ddd;


font-size:16px;


}





button{


width:100%;


padding:13px;


margin-top:15px;


border:none;


border-radius:12px;


background:linear-gradient(
135deg,
#2563eb,
#16a34a
);


color:white;


font-size:16px;


font-weight:bold;


cursor:pointer;


}





.result{


margin-top:15px;


padding:15px;


background:#ecfdf5;


border-radius:12px;


text-align:center;


color:#065f46;


font-size:20px;


font-weight:bold;


}




.formula{


margin-top:20px;


background:#eff6ff;


padding:15px;


border-radius:15px;


color:#1e40af;


text-align:center;


}




.example{


margin-top:20px;


background:#f8fafc;


padding:15px;


border-radius:15px;


border-left:5px solid #2563eb;


}



.example h3{


color:#2563eb;


margin-bottom:10px;


}



.example p{


margin-top:8px;


line-height:1.5;


}



.answer{


background:#dcfce7;


padding:10px;


border-radius:10px;


color:#166534;


font-weight:bold;


}





.footer{


text-align:center;


margin-top:20px;


font-size:13px;


color:#64748b;


}



</style>


</head>



<body>




<div class="box">



<div class="icon">

📊

</div>


<h1>
Percentage Calculator
</h1>




<input 
id="total"
type="number"
placeholder="Enter Total Value">





<input 
id="obtained"
type="number"
placeholder="Enter Obtained Value">





<button onclick="calculate()">

Calculate Percentage

</button>





<div class="result" id="result">

Result

</div>







<div class="formula">


<h3>
📐 Formula
</h3>


<p>

Percentage =

<br>

(Obtained Value ÷ Total Value) × 100

</p>


</div>







<div class="example">


<h3>
📘 Example
</h3>



<p>

<strong>Question:</strong><br>

A student scored 425 marks out of 500 marks.

</p>




<p>

<strong>Calculation:</strong><br>

(425 ÷ 500) × 100

</p>




<p class="answer">


<strong>Answer:</strong><br>

85%


</p>



</div>







<div class="footer">


S A D Developer

<br>

Smart Academic Dashboard


</div>




</div>






<script>


function calculate(){


let total =

Number(document.getElementById("total").value);



let obtained =

Number(document.getElementById("obtained").value);




if(total==0 || total==""){


document.getElementById("result").innerHTML=

"Enter Valid Value";


return;


}





let percent =

(obtained / total) * 100;




document.getElementById("result").innerHTML=

percent.toFixed(2)+" %";


}



</script>




</body>

</html>
