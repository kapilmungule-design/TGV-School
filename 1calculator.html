<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Smart Calculator</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial;

}



body{


min-height:100vh;


display:flex;

justify-content:center;

align-items:center;


background:

linear-gradient(
135deg,
#dbeafe,
#dcfce7,
#fef3c7
);


}



.calculator{


width:350px;


background:#ffffff;


padding:20px;


border-radius:30px;


box-shadow:

0 15px 35px #0004;


}



.title{


text-align:center;


color:#047857;


margin-bottom:15px;


}



.display{


width:100%;


height:70px;


border-radius:15px;


border:none;


background:#ecfdf5;


font-size:30px;


text-align:right;


padding:15px;


color:#064e3b;


margin-bottom:15px;


}





.buttons{


display:grid;


grid-template-columns:repeat(4,1fr);


gap:12px;


}





button{


height:55px;


border:none;


border-radius:15px;


font-size:20px;


font-weight:bold;


cursor:pointer;


background:#f1f5f9;


}



button:hover{


transform:scale(1.05);


}




.operator{


background:#2563eb;


color:white;


}



.equal{


background:#16a34a;

color:white;


grid-column:span 2;


}




.clear{


background:#dc2626;

color:white;


}





.footer{


text-align:center;


margin-top:15px;


font-size:12px;


color:#64748b;


}


</style>


</head>



<body>




<div class="calculator">


<h2 class="title">
🧮 Smart Calculator
</h2>



<input 
type="text"
id="display"
class="display"
readonly>



<div class="buttons">


<button class="clear" onclick="clearDisplay()">
C
</button>


<button onclick="deleteLast()">
⌫
</button>


<button onclick="add('%')">
%
</button>


<button class="operator" onclick="add('/')">
÷
</button>




<button onclick="add('7')">
7
</button>


<button onclick="add('8')">
8
</button>


<button onclick="add('9')">
9
</button>


<button class="operator" onclick="add('*')">
×
</button>





<button onclick="add('4')">
4
</button>


<button onclick="add('5')">
5
</button>


<button onclick="add('6')">
6
</button>


<button class="operator" onclick="add('-')">
-
</button>





<button onclick="add('1')">
1
</button>


<button onclick="add('2')">
2
</button>


<button onclick="add('3')">
3
</button>


<button class="operator" onclick="add('+')">
+
</button>





<button onclick="add('0')">
0
</button>


<button onclick="add('.')">
.
</button>


<button class="equal" onclick="calculate()">
=
</button>



</div>




<div class="footer">

S A D Developer

</div>



</div>






<script>


let display=document.getElementById("display");



function add(value){

display.value += value;

}




function clearDisplay(){

display.value="";

}




function deleteLast(){

display.value =
display.value.slice(0,-1);

}





function calculate(){


try{


display.value = eval(display.value);


}


catch{


display.value="Error";


}



}



</script>



</body>

</html>
