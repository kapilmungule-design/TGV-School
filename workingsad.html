<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Working</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#000;

width:100%;
height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.container{

width:100%;

padding:20px;

text-align:center;

}

.logo{

width:100%;

max-width:700px;

height:45vh;

margin:auto;

display:flex;

justify-content:center;

align-items:center;

}

.logo img{

width:100%;

height:100%;

object-fit:contain;

}

.typing{

margin-top:25px;

font-size:30px;

font-weight:600;

color:#ffffff;

overflow:hidden;

white-space:nowrap;

display:inline-block;

border-right:3px solid #00E5FF;

animation:

typing 3s steps(18,end) infinite,

blink .8s infinite;

}

@keyframes typing{

0%{width:0;}

50%{width:260px;}

90%{width:260px;}

100%{width:0;}

}

@keyframes blink{

50%{
border-color:transparent;
}

}

.msg{

margin-top:20px;

font-size:17px;

color:#9CA3AF;

line-height:1.8;

}

@media(max-width:768px){

.logo{

height:35vh;

max-width:95%;

}

.typing{

font-size:22px;

}

.msg{

font-size:15px;

padding:0 10px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="sad logo.png" alt="Working">

</div>

<div class="typing">

We Are Working...

</div>

<div class="msg">

STAY TURN ...

</div>

</div>

</body>
</html>
